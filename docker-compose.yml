# FC Schattdorf – lokale WordPress-Entwicklungsumgebung
# Start:  ./scripts/setup.sh
# Stop:   docker compose down
# Reset:  ./scripts/reset.sh   (löscht ALLE Daten)

services:
  # ------------------------------------------------------------------
  # Datenbank
  # ------------------------------------------------------------------
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------
  # WordPress (Webserver)  ->  http://localhost:8080
  # ------------------------------------------------------------------
  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG}
    volumes:
      - wp_data:/var/www/html
      # Nur das Child-Theme wird vom Host eingebunden, damit du es bequem editieren kannst:
      - ./wp-content/themes/fcschattdorf-child:/var/www/html/wp-content/themes/fcschattdorf-child

  # ------------------------------------------------------------------
  # WP-CLI (Kommandozeile, wird nur vom Setup-Skript verwendet)
  # ------------------------------------------------------------------
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]      # startet NICHT bei "docker compose up", nur via "run"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/fcschattdorf-child:/var/www/html/wp-content/themes/fcschattdorf-child
    user: "33:33"          # www-data, damit Dateirechte stimmen

  # ------------------------------------------------------------------
  # Adminer (Datenbank im Browser ansehen)  ->  http://localhost:8081
  # ------------------------------------------------------------------
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT}:8080"

volumes:
  db_data:
  wp_data:
